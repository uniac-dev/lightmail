name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: go vet ./... && go test -race ./...
      - run: go vet ./... && go test -race ./...
        working-directory: dashboard/server
      - run: docker build -t mail-sender:check .
      - run: docker build -f dashboard/Dockerfile -t mail-sender-dashboard:check .
